apply plugin: 'com.android.application'

android {
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.shrimpfarm.app"
        namespace "com.shrimpfarm.app"
        minSdkVersion 28
        targetSdkVersion 36
        versionCode 6
        versionName "1.5.6"
multiDexEnabled true
    ndk { abiFilters "arm64-v8a" }
    packagingOptions {
        pickFirst 'lib/arm64-v8a/libonnxruntime.so'
        pickFirst 'lib/armeabi-v7a/libonnxruntime.so'
        pickFirst 'lib/x86/libonnxruntime.so'
        pickFirst 'lib/x86_64/libonnxruntime.so'
        pickFirst 'lib/arm64-v8a/libonnxruntime4j_jni.so'
        pickFirst 'lib/armeabi-v7a/libonnxruntime4j_jni.so'
        pickFirst 'lib/x86/libonnxruntime4j_jni.so'
        pickFirst 'lib/x86_64/libonnxruntime4j_jni.so'
    }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
        ndkVersion "30.0.15729638"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    implementation "androidx.work:work-runtime:2.11.2"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.github.k2-fsa.sherpa-onnx:sherpa-onnx:v1.13.8'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.28.0'
    implementation 'org.apache.commons:commons-compress:1.26.2'
    implementation 'com.github.lecho:hellocharts-library:1.5.8@aar'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.github.bumptech.glide:glide:5.0.7'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.7'
    implementation 'com.github.houbb:sensitive-word:0.29.5'
}
