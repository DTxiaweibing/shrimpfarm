apply plugin: 'com.android.application'

// 签名配置从仓库外的 keystore.properties 读取（与 mixcalc-lab 同一把 debug.keystore）。
// 文件不存在时 release 保持未签名，别人拉代码仍能 assembleDebug。
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { stream ->
        // 路径可能含中文，按 UTF-8 读取，避免 Properties 默认 ISO-8859-1 乱码
        keystoreProps.load(new InputStreamReader(stream, 'UTF-8'))
    }
}
def hasSigningConfig = keystorePropsFile.exists() && keystoreProps['storeFile']

android {
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.shrimpfarm.app"
        namespace "com.shrimpfarm.app"
        minSdkVersion 28
        targetSdkVersion 36
        versionCode 8
        versionName "1.5.8"
multiDexEnabled true
    ndk { abiFilters "arm64-v8a" }
    packagingOptions {
        pickFirst 'lib/arm64-v8a/libonnxruntime.so'
        pickFirst 'lib/armeabi-v7a/libonnxruntime.so'
        pickFirst 'lib/x86/libonnxruntime.so'
        pickFirst 'lib/x86_64/libonnxruntime.so'
        pickFirst 'lib/arm64-v8a/libonnxruntime4j_jni.so'
        pickFirst 'lib/armeabi-v7a/libonnxruntime4j_jni.so'
        pickFirst 'lib/x86/libonnxruntime4j_jni.so'
        pickFirst 'lib/x86_64/libonnxruntime4j_jni.so'
    }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
        ndkVersion "30.0.15729638"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        release {
            if (hasSigningConfig) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                // 三种签名方案全开：V1(JAR) 兼容老设备、V2 Android 7+、V3 Android 9+
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    implementation "androidx.work:work-runtime:2.11.2"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.github.k2-fsa.sherpa-onnx:sherpa-onnx:v1.13.8'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.28.0'
    implementation 'org.apache.commons:commons-compress:1.26.2'
    implementation 'com.github.lecho:hellocharts-library:1.5.8@aar'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.github.bumptech.glide:glide:5.0.7'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.7'
    implementation 'com.github.houbb:sensitive-word:0.29.5'
    testImplementation 'junit:junit:4.13.2'
}
